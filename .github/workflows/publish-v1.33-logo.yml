name: Publish verified Twitch 1.33 revision
on:
  push:
    branches: ['release/v1.33-logo']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: twitch-vita-feature-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'joaopedr00000/TwitchonVita' && github.ref == 'refs/heads/release/v1.33-logo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact tested CI package from logo and START revision
        uses: actions/download-artifact@v4
        with:
          name: Twitch-1.33-LogoRevision
          run-id: 46100722493
          github-token: ${{ github.token }}
          path: dist
      - name: Verify package and publish same-version revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS-release.txt)
          python3 - <<'PY'
          import zipfile, hashlib, pathlib
          with zipfile.ZipFile('dist/Twitch-1.33.vpk') as z:
              assert z.testzip() is None
              for name in ['sce_sys/icon0.png','sce_sys/livearea/contents/bg.png','sce_sys/livearea/contents/startup.png','sce_sys/livearea/contents/template.xml']:
                  assert z.read(name) == pathlib.Path(name).read_bytes(), name
              sfo=z.read('sce_sys/param.sfo')
              assert b'01.33' in sfo and b'VTWI00001' in sfo and b'Twitch\x00' in sfo
          PY
          actual="$(sha256sum dist/Twitch-1.33.vpk | cut -d ' ' -f 1)"
          printf '\nSHA-256 (logo and START revision): `%s`\n' "$actual" >> RELEASE-1.33.md
          OLD=v1.33-classic
          NEW=v1.33-rev2
          # Update the existing release using a new tag (the old ref is protected).
          # The executable is still version 01.33; this tag identifies the revision.
          if gh release view "$NEW" --repo "$GH_REPO" >/dev/null 2>&1; then
            TAG="$NEW"
          else
            gh release edit "$OLD" --repo "$GH_REPO" --tag "$NEW" --target "$GITHUB_SHA" --title "Twitch 1.33" --notes-file RELEASE-1.33.md --latest
            TAG="$NEW"
          fi
          gh release upload "$TAG" dist/Twitch-1.33.vpk dist/SHA256SUMS-release.txt --repo "$GH_REPO" --clobber
          remote="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="Twitch-1.33.vpk") | .digest')"
          test "$remote" = "sha256:$actual"
          gh release edit "$TAG" --repo "$GH_REPO" --notes-file RELEASE-1.33.md --title "Twitch 1.33" --latest
          gh release view "$TAG" --repo "$GH_REPO" --json url,tagName,isDraft,isPrerelease,assets
