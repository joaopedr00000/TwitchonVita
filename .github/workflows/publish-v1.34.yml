name: Publish verified Twitch 1.34
on:
  push:
    branches: ['release/v1.34']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-twitch-v1-34
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'joaopedr00000/TwitchonVita' && github.ref == 'refs/heads/release/v1.34'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact Test 33 package
        uses: actions/download-artifact@v4
        with:
          name: Twitch-1.34-MediaPlayback33-EXPERIMENTAL
          run-id: 46118799238
          github-token: ${{ github.token }}
          path: dist
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/46118799238" --jq '.head_sha')" = '730dc94350270e797e34c55c4e18ed798ed6f08f'
          test "$(gh api "repos/$GH_REPO/actions/runs/46118799238" --jq '.conclusion')" = success
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import zipfile, pathlib
          with zipfile.ZipFile('dist/Twitch-1.34-MediaPlayback33.vpk') as z:
              assert z.testzip() is None
              sfo=z.read('sce_sys/param.sfo')
              assert b'01.34' in sfo and b'VTWI00001' in sfo and b'Twitch\x00' in sfo
              assert z.read('ca/cacert.pem').count(b'-----BEGIN CERTIFICATE-----')>=100
              assert 'eboot.bin' in z.namelist()
              for name in ('sce_sys/icon0.png','sce_sys/livearea/contents/bg.png','sce_sys/livearea/contents/startup.png','sce_sys/livearea/contents/template.xml'):
                  assert z.read(name)==pathlib.Path(name).read_bytes()
          PY
          mv dist/Twitch-1.34-MediaPlayback33.vpk dist/Twitch-1.34.vpk
          (cd dist && sha256sum Twitch-1.34.vpk > SHA256SUMS-release.txt)
          actual="$(sha256sum dist/Twitch-1.34.vpk | cut -d ' ' -f 1)"
          printf '\nSHA-256: `%s`\n' "$actual" >> RELEASE-1.34.md
          if ! gh release view v1.34 --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create v1.34 --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Twitch 1.34" --notes-file RELEASE-1.34.md --draft
          fi
          test "$(gh release view v1.34 --repo "$GH_REPO" --json isDraft --jq '.isDraft')" = true
          gh release upload v1.34 dist/Twitch-1.34.vpk dist/SHA256SUMS-release.txt --repo "$GH_REPO" --clobber
          remote="$(gh api "repos/$GH_REPO/releases/tags/v1.34" --jq '.assets[] | select(.name=="Twitch-1.34.vpk") | .digest')"
          test "$remote" = "sha256:$actual"
          gh release edit v1.34 --repo "$GH_REPO" --draft=false --prerelease=false --latest --notes-file RELEASE-1.34.md
          gh release view v1.34 --repo "$GH_REPO" --json url,tagName,isDraft,isPrerelease,assets
