name: Publish hardware-approved Twitch 1.33 Classic
on:
  push:
    branches: ['release/v1.33-classic']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-twitch-133-classic
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'joaopedr00000/TwitchonVita' && github.ref == 'refs/heads/release/v1.33-classic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Download exact hardware-approved executable
        uses: actions/download-artifact@v4
        with:
          name: Twitch-1.33-Classic-EXPERIMENTAL
          run-id: 46097579491
          github-token: ${{ github.token }}
          path: dist
      - name: Restore approved art and verify exact release package
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 scripts/package_133_release.py; then
            # Debian trixie uses the same zlib 1.3.1 as the validated package.
            docker run --rm -v "$PWD:/src" -w /src python:3.13.5-slim-trixie python scripts/package_133_release.py
          fi
          cd dist
          sha256sum -c SHA256SUMS-release.txt
      - name: Create draft with assets, then publish stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v1.33-classic
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; not overwriting a published package."
            exit 1
          fi
          gh release create "$TAG" dist/Twitch-1.33.vpk dist/SHA256SUMS-release.txt --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Twitch 1.33" --notes-file RELEASE-1.33.md --draft
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --latest
          gh release view "$TAG" --repo "$GH_REPO" --json url,tagName,isDraft,isPrerelease,assets
